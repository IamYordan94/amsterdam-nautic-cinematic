<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAART — Amsterdam boottickets</title>
  <meta name="description" content="Alle Amsterdamse rondvaarten, open boten, zelfvaar en diner cruises op één plek." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top HUD -->
  <header class="hud">
    <div class="hud__brand">
      <span class="hud__logo">VAART</span>
      <span class="hud__sub">Amsterdam · boottickets</span>
    </div>
    <button class="hud__list" id="listBtn">Alle aanbieders <span id="count">25</span></button>
  </header>

  <!-- Scroll-scrubbed hero -->
  <section class="scrub" id="scrub">
    <div class="scrub__pin">
      <video id="heroVideo" class="scrub__video" src="video/canal-hero.mp4" muted playsinline preload="auto"></video>
      <div class="scrub__shade"></div>
      <div class="scrub__content">
        <p class="scrub__eyebrow">Amsterdam · boottickets</p>
        <h1 class="scrub__title">Vaar mee.</h1>
        <p class="scrub__sub">Scroll om door de grachten te varen — alle 25 aanbieders op één plek.</p>
        <div class="scrub__tags" id="tags"></div>
      </div>
      <div class="scrub__hint" id="hint"><span class="scrub__hint-dot"></span> Scroll om te varen</div>
    </div>
  </section>

  <!-- Providers -->
  <section class="providers" id="providers">
    <div class="providers__head">
      <p class="providers__eyebrow">Alle aanbieders</p>
      <h2 class="providers__title">Kies je boot.</h2>
    </div>
    <div class="providers__grid" id="grid"></div>
  </section>

  <!-- Provider detail card -->
  <aside class="card" id="card" aria-hidden="true">
    <button class="card__close" id="cardClose" aria-label="Sluiten">×</button>
    <span class="card__cat" id="cardCat"></span>
    <h2 class="card__name" id="cardName"></h2>
    <p class="card__tag" id="cardTag"></p>
    <div class="card__foot">
      <span class="card__price" id="cardPrice"></span>
      <a class="card__book" id="cardBook" href="#" target="_blank" rel="noopener">Boek ticket →</a>
    </div>
  </aside>

  <!-- Full provider list panel -->
  <nav class="panel" id="panel" aria-hidden="true">
    <button class="panel__close" id="panelClose" aria-label="Sluiten">×</button>
    <h2 class="panel__title">Alle aanbieders</h2>
    <div class="panel__list" id="panelList"></div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
